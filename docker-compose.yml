services:
  troubleshoot-api:
    build: .
    container_name: prism-troubleshoot-engine
    ports:
      - "8000:8000"
    environment:
      # Read from your shell or a local .env file (never commit the real key)
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in your shell or .env file}
    restart: unless-stopped
